<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Autonomuse</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Autonomuse.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app"></div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script>
        window.scrollToTop = () => document.querySelector('.right-content').scrollTop = 0;
        window.infiniteScroll = { observer: null };
        window.setupInfiniteScroll = (sentinelId, dotNetRef) => {
            window.teardownInfiniteScroll();
            const el = document.getElementById(sentinelId);
            if (!el) return;
            window.infiniteScroll.observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) dotNetRef.invokeMethodAsync('LoadMore');
            }, { rootMargin: '400px' });
            window.infiniteScroll.observer.observe(el);
        };
        window.teardownInfiniteScroll = () => {
            if (window.infiniteScroll.observer) {
                window.infiniteScroll.observer.disconnect();
                window.infiniteScroll.observer = null;
            }
        };
    </script>

</body>

</html>
